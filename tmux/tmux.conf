# clipboard
setw -g mouse on
set-option -g set-clipboard external
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -sel clip'
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel 'xclip -sel clip'

set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys:sixel'

set -g focus-events on

set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_current_command},nono},claude,#{pane_current_command}} #{b:pane_current_path}'

# status bar
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g status-right 'CPU: #(~/.tmux/scripts/cpu.sh) | RAM: #{ram_percentage} | %a %h-%d %H:%M '
set -g status-right-length 80
set -g status-interval 5

run '~/.tmux/plugins/tpm/tpm'
